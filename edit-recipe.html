<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Recipe</title>
    <link rel="stylesheet" href="Styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">✏️</span>
          <div>
            <p class="eyebrow">Recipe editor</p>
            <h1>Edit Recipe</h1>
          </div>
        </div>
        <a href="index.html" class="secondary-btn" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">Back to recipes</a>
      </header>

      <main class="layout" style="grid-template-columns: minmax(0, 720px); justify-content: center;">
        <section class="panel">
          <form id="edit-recipe-form">
            <label>
              <span>Recipe name</span>
              <input type="text" id="edit-recipe-title" required />
            </label>

            <label>
              <span>Category</span>
              <input type="text" id="edit-recipe-category" />
            </label>

            <label>
              <span>Prep time</span>
              <input type="text" id="edit-recipe-time" />
            </label>

            <label>
              <span>Ingredients</span>
              <textarea id="edit-recipe-ingredients" rows="6" required></textarea>
            </label>

            <label>
              <span>Steps</span>
              <textarea id="edit-recipe-steps" rows="6" required></textarea>
            </label>

            <button type="submit" class="primary-btn">Save Changes</button>
          </form>
        </section>
      </main>
    </div>

    <script src="edit-script.js"></script>
  </body>
</html>
